[package]
name = "kernel"
version = "0.2.0"
edition = "2024"

[dependencies]
spin = "0.9.8"
x86 = "0.52.0"
uart_16550 = "0.6.0"
x86_64 = "0.15.5"
linked_list_allocator = { version = "0.10.5", default-features = false }

[features]
test-hooks = []

[profile.dev]

[profile.test]
opt-level = 1
debug = false 

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = false # Changed from "symbols" to prevent rust-lld heap corruption
opt-level = 1

[[bin]]
name = "kernel"
test = false
bench = false

[[test]]
name = "should_panic"
harness = false

[[test]]
name = "stack_overflow"
harness = false
